name: build

# Pinned dependencies.
#
# Every third-party action is pinned to a full commit SHA and every container to
# an immutable digest, so a run is reproducible and an upstream retag cannot
# change what executes here. Each pin carries the human-readable release it came
# from; update the comment whenever the pin moves.
#
# To bump the TeX Live image, see CONTRIBUTING.md ("Bumping the pinned TeX Live
# image"). The `toolchain` job records the exact versions a run used; read its
# artifact to learn which TeX Live release a digest resolves to.
#
#   texlive/texlive        digest below == :latest as published 2026-07-12
#   actions/checkout       v4.3.1
#   actions/upload-artifact v7.0.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Docs-only classifier (issues #568 and #614). On a pull request whose diff
  # touches only docs-only paths, the TeX jobs are skipped: every job in the
  # TeX Live container, `toolchain` among them. `lint` runs regardless, and so
  # does every job on a push to main.
  #
  # Skipping is done with a job-level `if:`, not a `paths:` filter on the
  # trigger: every job here is a required status check on the `Protect Main`
  # ruleset, and a job whose workflow never starts never reports, so the pull
  # request would wait on it forever. A job skipped by `if:` reports, and a
  # skipped required check counts as passed.
  #
  # The guard on each TeX job is fail-safe: it runs the job when this
  # classifier did not succeed. Without that, a failed `changes` job would skip
  # its dependants, and the skips would satisfy the required checks untested.
  #
  # The path list and its test live in tests/lib/docs-only.sh (#603), which
  # `make check` calls too, so CI and the local gate share one definition of
  # docs-only. That script's header holds the list, the greps that keep it
  # safe, and why `doc/careerdossier.tex` is not on it; `make lint` tests it
  # (tests/lint/run-docs-only.sh). A pull request that edits the script is not
  # docs-only, so it runs every job.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      tex: ${{ steps.classify.outputs.tex }}
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      # Full history, so the merge base of the two commits below is present.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      # --no-renames lists both sides of a rename, so moving a source file into
      # docs/ still counts as touching the source file it removes.
      - name: Classify the pull request diff
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Event $EVENT_NAME: every job runs."
            echo "tex=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA")
          echo "Files changed since the merge base:"
          printf '%s\n' "$files" | sed 's/^/  /'
          # Exit 0 is docs-only. Anything else -- not docs-only, an empty
          # diff, or a classifier that could not run -- runs every job.
          if printf '%s\n' "$files" | tests/lib/docs-only.sh --paths; then
            echo "Docs-only diff: the TeX jobs are skipped."
            echo "tex=false" >> "$GITHUB_OUTPUT"
          else
            echo "A path outside the docs-only list changed: every job runs."
            echo "tex=true" >> "$GITHUB_OUTPUT"
          fi

  toolchain:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # CONTRIBUTING.md "CI expectations" requires the tested toolchain to be
      # recorded beside the output it produced.
      - name: Record toolchain versions
        run: |
          {
            echo "# CareerDossierTeX toolchain record"
            echo "date-utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "commit:   ${GITHUB_SHA}"
            echo
            echo "## TeX Live"
            tlmgr --version 2>&1 || echo "tlmgr: unavailable"
            echo
            echo "## LuaHBTeX / LuaLaTeX format"
            lualatex --version 2>&1 | head -3
            echo "format: $(kpsewhich --engine=luahbtex --format=fmt lualatex.fmt || echo NOT-FOUND)"
            echo
            echo "## fontspec"
            kpsewhich fontspec.sty
            # fontspec declares {date}{version} on the line after
            # \ProvidesExplPackage, so -A1 is required to capture the version.
            grep -A1 -m1 'ProvidesExplPackage' "$(kpsewhich fontspec.sty)" || true
            echo
            echo "## PDF management"
            kpsewhich pdfmanagement-testphase.sty || echo "pdfmanagement-testphase: NOT-FOUND"
            grep -A1 -m1 'ProvidesExplPackage' "$(kpsewhich pdfmanagement-testphase.sty)" || true
            echo
            echo "## tagpdf (used once tagged fixtures are added)"
            kpsewhich tagpdf.sty || echo "tagpdf: NOT-FOUND"
            grep -A1 -m1 'ProvidesExplPackage' "$(kpsewhich tagpdf.sty)" || true
            echo
            echo "## l3build"
            l3build --version 2>&1 | head -4 || echo "l3build: unavailable"
            echo
            echo "## BibLaTeX / Biber"
            kpsewhich biblatex.sty || echo "biblatex: NOT-FOUND"
            biber --version 2>&1 | head -2 || echo "biber: unavailable"
            echo
            echo "## default fonts"
            for f in texgyretermes-regular.otf texgyreheros-regular.otf; do
              echo "$f -> $(kpsewhich "$f" || echo NOT-FOUND)"
            done
          } | tee toolchain.txt
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload toolchain record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: toolchain-record
          path: toolchain.txt
          if-no-files-found: warn

  # The one job that needs no TeX. tests/lint/run.sh only reads the sources, so
  # it runs on the bare runner in seconds rather than pulling the TeX Live
  # container — and it is the second toolchain the lint needs: local `grep` is
  # ugrep and local `awk` is the one-true-awk, so a pattern that works on the
  # maintainer's machine is not thereby proven to work here.
  lint:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Record lint toolchain
        run: |
          bash --version | head -1
          grep --version | head -1
          awk --version 2>&1 | head -1 || awk -W version 2>&1 | head -1
          # The harness lint runs shellcheck, and it adds checks between
          # releases, so which version ran is part of what a green lint means.
          shellcheck --version | sed -n 's/^version: /shellcheck /p'
      - name: Static lint (source-level invariants no compiled fixture asserts)
        run: make lint

  regression:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Module regression suite (l3build check on LuaTeX)
        run: l3build check
      # The CTAN packaging configuration, which lives in the same build.lua this
      # job already loads. It is not in the `lint` job because it loads that file
      # under `texlua` rather than reading it, and that job runs on a bare runner
      # with no TeX. Locally it is `make ctan-lint`, dispatched by `make check`.
      - name: CTAN packaging configuration (build.lua)
        run: tests/lint/run-ctan-config.sh
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: regression-logs
          path: build/test/*.log
          if-no-files-found: warn

  extraction:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install poppler-utils
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      - name: Extraction round-trip
        run: tests/extraction/run.sh
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload extraction PDFs and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extraction-artifacts
          path: |
            tests/extraction/*.pdf
            tests/extraction/*.log
            tests/extraction/*.diff
          if-no-files-found: warn

  tagging:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # poppler-utils matches the extraction job. mupdf-tools supplies mutool,
      # the second independent extractor: Poppler and MuPDF linearize the
      # two-column entry header differently, so agreement between them is what
      # makes "reading order is preserved" a claim about the PDF rather than
      # about one library's heuristics.
      - name: Install poppler-utils and mupdf-tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends poppler-utils mupdf-tools
      # veraPDF is deliberately NOT installed here. Building it from source
      # (maven + a JDK) adds several minutes that this per-PR job should not
      # pay on every push; the weekly `verapdf-scheduled` workflow
      # (.github/workflows/verapdf-scheduled.yml) builds it from a pinned
      # commit and runs this same gate instead (issue #94). The runner skips
      # the gate here with a notice and names it in its closing summary, so a
      # CI pass in this job is not mistaken for a validated one.
      #
      # The PDFKit gate likewise cannot run on Linux; it is covered locally on
      # macOS and by the committed *.pdfkit.txt baselines.
      #
      # This job, `smoke`, and `layout` run their fixtures concurrently, one per
      # core (issue #631); the runner's accounting line in the log is what shows
      # every fixture ran exactly once. `make tagging` stays serial locally.
      - name: Tagged-PDF structure, extraction, and geometry fixtures
        run: |
          jobs="$(nproc)"
          echo "fixture jobs: $jobs (nproc)"
          tests/tagging/run.sh --jobs "$jobs"
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload tagging reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tagging-reports
          path: tests/tagging/reports/
          if-no-files-found: warn

  # `smoke` and `layout` are their own jobs, matching `extraction` and
  # `tagging`, because each is a whole suite of double-pass LuaLaTeX compiles
  # rather than one example build. Running them here instead of inside `resume`
  # lets them start in parallel with every other job; the `resume` job below is
  # once again only as slow as the example it builds.
  smoke:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # No poppler here: tests/smoke/run.sh only compiles and greps the engine
      # rejection messages. It does need xelatex and pdflatex, which the image
      # already provides, to prove the unsupported engines fail as required.
      # Fixtures run one per core, as in `tagging` above.
      - name: Smoke tests (supported builds and required failures)
        run: |
          jobs="$(nproc)"
          echo "fixture jobs: $jobs (nproc)"
          tests/smoke/run.sh --jobs "$jobs"
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload smoke PDFs and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: smoke-artifacts
          path: |
            tests/smoke/*.pdf
            tests/smoke/*.log
            tests/smoke/*.stdout
          if-no-files-found: warn

  layout:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # tests/layout/run.sh skips its folio, contact-line, and page-break checks
      # with a notice when poppler is absent, so pdftotext and pdfinfo must be
      # installed for this job to assert anything.
      - name: Install poppler-utils
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      # Fixtures run one per core, as in `tagging` above.
      - name: Layout-stress tests
        run: |
          jobs="$(nproc)"
          echo "fixture jobs: $jobs (nproc)"
          tests/layout/run.sh --jobs "$jobs"
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload layout PDFs and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: layout-artifacts
          path: |
            tests/layout/*.pdf
            tests/layout/*.log
            tests/layout/*.stdout
          if-no-files-found: warn

  resume:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build the resume example
        run: make resume
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload resume PDF and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: resume-artifacts
          path: |
            build/examples/resume-english.pdf
            build/examples/resume-english.log
          if-no-files-found: warn

  # The PDF manual CTAN requires. It is not in `make check`'s target set --
  # that list is the eleven test suites, and this is a documentation artifact --
  # so this job is the only automated thing that would notice the manual failing
  # to compile. Keep it that way, or add `manual` to CHECK_TARGETS; do not leave
  # it in neither place.
  manual:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build the PDF manual
        run: make manual
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload the manual PDF and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: manual-artifacts
          path: |
            build/manual/careerdossier.pdf
            build/manual/careerdossier.log
          if-no-files-found: warn

  letter:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build the cover-letter example
        run: make letter
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload cover-letter PDF and log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: letter-artifacts
          path: |
            build/examples/letter-industry.pdf
            build/examples/letter-industry.log
          if-no-files-found: warn

  # The Biber fixture is its own job for discoverability, not for speed. Unlike
  # the #190 split of `smoke` and `layout` -- multi-minute suites where a
  # separate runner buys real wall clock -- the fixture itself takes ~15s, so
  # this job spends far longer initializing its container than testing. What it
  # buys is a named check: buried inside `cv`, the coverage was invisible, and
  # issue #211 was investigated at length on the premise that CI never
  # exercised this path, when `cv` had in fact run it since #69. A named job
  # answers that from the checks list alone, and it is the second toolchain
  # that tells a local Biber fault apart from a general one. Fold it back into
  # `cv` if the runner is ever worth more than that.
  bibliography:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # tests/bibliography/run.sh diffs extracted text, so pdftotext must be
      # present for the ydnt-ordering and identifier-precedence assertions to
      # run at all. It is also what reads the rendered entry labels for the
      # shipped-example guard (issue #319).
      # mupdf-tools supplies mutool, which is the only tool here that reports
      # which font a run of text is set in. The multi-word author-highlighting
      # assertion (issue #541) needs that and nothing else does: the defect it
      # guards changes the weight of a name and not one character of the
      # extracted text, so poppler cannot see it. The runner skips that one
      # assertion when mutool is absent, and installing it here is what keeps CI
      # from being the run that skips it.
      - name: Install poppler-utils and mupdf-tools
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils mupdf-tools
      # Also builds examples/academic/cv-bibliography.tex from the repository
      # root and asserts it rendered every entry its database declares, which is
      # why this job's artifacts reach outside tests/bibliography/ as well
      # (#319). That build has its own output directory rather than the
      # `academic-bibliography' target's build/examples/, because both are
      # reached by `make check' and concurrently they would race (#378).
      - name: Biber fixture and shipped-example bibliography guard
        run: make bibliography-test
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload bibliography fixture logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bibliography-artifacts
          path: |
            tests/bibliography/*.pdf
            tests/bibliography/*.log
            tests/bibliography/*.blg
            tests/bibliography/*.diff
            tests/bibliography/*.stdout
            tests/bibliography/*.guard
            build/bibliography-example/cv-bibliography.pdf
            build/bibliography-example/cv-bibliography.log
            build/bibliography-example/cv-bibliography.blg
            build/bibliography-example/cv-bibliography.bbl
          if-no-files-found: warn

  # Copy-paste integrity of URLs and e-mail addresses (issue #294). Its own job
  # for the same reason `bibliography` is: the property is invisible in the
  # rendered page and in ordinary extracted text, so a named check is what makes
  # the coverage findable. It needs Biber as well as poppler — the bibliography
  # is the only site that puts stretchable glue at a URL's breakpoints, and the
  # suite's negative control lives there.
  links:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      # tests/links/run.sh decides split-versus-wrap from `pdftotext -bbox`
      # coordinates and exits early without it, so poppler is not optional here.
      - name: Install poppler-utils
        run: apt-get update && apt-get install -y --no-install-recommends poppler-utils
      - name: Link copy-paste integrity fixtures
        run: make links
      # actions/upload-artifact v7.0.1: https://github.com/actions/upload-artifact/releases/tag/v7.0.1
      - name: Upload link fixture PDFs and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: links-artifacts
          path: |
            tests/links/*.pdf
            tests/links/*.log
            tests/links/*.blg
            tests/links/*.tokens
          if-no-files-found: warn

  # Default-path PDF metadata (issue #276). Deliberately its own job rather than
  # part of `tagging`, which is the suite it exists to complement: every tagging
  # fixture opts into \DocumentMetadata, and that is precisely what masks the
  # package's own /Lang. Naming the job keeps the distinction visible from the
  # checks list, the way `bibliography` does. It needs no PDF tooling — the
  # fixtures build uncompressed and the runner reads the catalog itself — so it
  # is the cheapest job in this workflow.
  metadata:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Default-path PDF metadata fixtures
        run: make metadata
      # No artifact upload: this runner builds in a temporary directory and
      # leaves nothing in the tree, and it prints the compile transcript of any
      # fixture that fails, so the job log already carries what a reviewer
      # needs. An upload step here would only ever report no files found.

  # Link-annotation action types (issue #328). Its own job for the same reason
  # `metadata` is: every other link-facing suite reads the text layer, and the
  # defect this one exists to catch — a scheme-less profile link emitted as a
  # GoToR remote-PDF action — leaves the page, the extracted text, and the
  # `links` copy-paste invariant all correct. Folding it into `links` would put
  # a text-layer verdict and an annotation verdict behind one check name. Like
  # `metadata` it needs no PDF tooling: the fixtures build uncompressed and the
  # runner reads the annotations itself.
  annotations:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
    runs-on: ubuntu-24.04
    container: texlive/texlive@sha256:d39efa547acfa518072600315280f92357ca8e0b9e295e09b6ccd5f5d82a1373
    steps:
      # actions/checkout v4.3.1: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Link-annotation action-type fixtures
        run: make annotations
      # No artifact upload, for the reason given under `metadata` above.

  cv:
    needs: changes
    # Fail-safe docs-only guard; see the `changes` job.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.tex == 'true') }}
